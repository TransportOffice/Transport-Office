
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TransportOffice</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;color:#183047}
header{background:#124b7a;color:white;padding:22px;text-align:center}
main{max-width:700px;margin:auto;padding:18px}
section{background:white;padding:20px;border-radius:12px;margin:15px 0}
input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:7px}
button{background:#1265a1;color:white;border:0;font-weight:bold}
.item{padding:12px 0;border-bottom:1px solid #ddd}
small{color:#666}
</style>
</head>
<body>
<header><h1>TransportOffice</h1><p>Deine Transportverwaltung</p></header>
<main>
<section>
<h2>Fahrer anlegen</h2>
<input id="fahrer" placeholder="Name des Fahrers">
<input id="telefon" placeholder="Telefonnummer">
<button onclick="fahrerSpeichern()">Fahrer speichern</button>
<div id="fahrerliste"></div>
</section>
<section>
<h2>Fahrzeug anlegen</h2>
<input id="kennzeichen" placeholder="Kennzeichen">
<input id="modell" placeholder="Fahrzeugmodell">
<button onclick="autoSpeichern()">Fahrzeug speichern</button>
<div id="autoliste"></div>
</section>
<section>
<h2>Beleg erfassen</h2>
<input type="file" id="foto" accept="image/*">
<button onclick="lesen()">Beleg automatisch lesen</button>
<p id="status"></p>
<input id="haendler" placeholder="Händler">
<input id="datum" type="date">
<input id="betrag" type="number" step="0.01" placeholder="Betrag in Euro">
<button onclick="belegSpeichern()">Beleg speichern</button>
<div id="belegliste"></div>
</section>
<p><small>Nur für Testdaten. Keine sichere Anmeldung oder Buchhaltungsarchivierung.</small></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const daten=JSON.parse(localStorage.getItem("to-demo")||'{"fahrer":[],"autos":[],"belege":[]}');
function sichern(){localStorage.setItem("to-demo",JSON.stringify(daten));anzeigen()}
function element(t){let d=document.createElement("div");d.className="item";d.textContent=t;return d}
function liste(id,werte,format){
const ziel=document.getElementById(id);ziel.replaceChildren();
werte.forEach(w=>ziel.appendChild(element(format(w))));
}
function anzeigen(){
liste("fahrerliste",daten.fahrer,x=>x.name+" – "+x.tel);
liste("autoliste",daten.autos,x=>x.k+" – "+x.m);
liste("belegliste",daten.belege,x=>x.h+" – "+x.b+" €");
}
function fahrerSpeichern(){
let name=document.getElementById("fahrer").value.trim();
if(!name)return alert("Name eingeben");
daten.fahrer.push({name,tel:document.getElementById("telefon").value});
sichern();
}
function autoSpeichern(){
let k=document.getElementById("kennzeichen").value.trim();
if(!k)return alert("Kennzeichen eingeben");
daten.autos.push({k,m:document.getElementById("modell").value});
sichern();
}
async function lesen(){
const f=document.getElementById("foto").files[0];
if(!f)return alert("Foto auswählen");
const status=document.getElementById("status");
status.textContent="Beleg wird gelesen...";
try{
const r=await Tesseract.recognize(f,"deu+eng");
const zeilen=r.data.text.split("\n").map(x=>x.trim()).filter(Boolean);
document.getElementById("haendler").value=zeilen[0]||"";
const datum=r.data.text.match(/\b(\d{2})\.(\d{2})\.(20\d{2})\b/);
if(datum)document.getElementById("datum").value=datum[3]+"-"+datum[2]+"-"+datum[1];
const betrag=r.data.text.match(/(?:SUMME|GESAMT|TOTAL|EUR)\s*:?\s*(\d+[,.]\d{2})/i);
if(betrag)document.getElementById("betrag").value=betrag[1].replace(",",".");
status.textContent="Erkennung fertig. Bitte Werte kontrollieren.";
}catch(e){status.textContent="Erkennung fehlgeschlagen. Bitte manuell eintragen."}
}
function belegSpeichern(){
const h=document.getElementById("haendler").value.trim();
const b=document.getElementById("betrag").value;
if(!h||!b)return alert("Händler und Betrag eingeben");
daten.belege.push({h,b,datum:document.getElementById("datum").value});
sichern();
}
anzeigen();
</script>
</body>
</html>
